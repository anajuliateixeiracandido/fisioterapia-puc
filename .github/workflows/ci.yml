name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/README.md'

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/fisioterapia_ci
          JWT_SECRET: ci-only-jwt-secret
          JWT_EXPIRES_IN: 1h
          REFRESH_TOKEN_EXPIRES_IN_DAYS: 7
          RESEND_API_KEY: re_ci_only
          RESEND_FROM: ci@example.com
          FRONTEND_URL: http://localhost:5173
          PASSWORD_RESET_EXPIRES_IN_MINUTES: 60
        run: |
          cd backend
          npm test || echo "No backend tests found"
      - name: Run frontend tests
        run: |
          cd frontend
          npm test || echo "No frontend tests found"

  delete-branch:
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      github.event.pusher && github.event.head_commit && github.event.before != '0000000000000000000000000000000000000000'
    steps:
      - name: Delete branch after merge
        uses: dawidd6/action-delete-branch@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
